<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
        }

        .calculator {
            background-color: #1f2937;
            border-radius: 1rem;
            padding: 1.5rem;
            width: 320px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .display {
            background-color: #374151;
            padding: 1.5rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
        }

        .previous-operand {
            color: #9ca3af;
            font-size: 1rem;
            min-height: 1.5rem;
        }

        .current-operand {
            color: #f9fafb;
            font-size: 2.5rem;
            font-weight: bold;
            min-height: 3rem;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            background-color: #4b5563;
            color: #f9fafb;
            font-size: 1.25rem;
            padding: 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button.operator {
            background-color: #3b82f6;
        }

        button.operator:hover {
            background-color: #2563eb;
        }

        button.clear {
            background-color: #ef4444;
            grid-column: span 2;
        }

        button.clear:hover {
            background-color: #dc2626;
        }

        button.equals {
            background-color: #10b981;
            grid-column: span 2;
        }

        button.equals:hover {
            background-color: #059669;
        }

        button.number:hover {
            background-color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="keypad">
            <button class="clear" data-action="clear">C</button>
            <button class="operator" data-action="delete">DEL</button>
            <button class="operator" data-action="divide">÷</button>
            
            <button class="number" data-number="7">7</button>
            <button class="number" data-number="8">8</button>
            <button class="number" data-number="9">9</button>
            <button class="operator" data-action="multiply">×</button>
            
            <button class="number" data-number="4">4</button>
            <button class="number" data-number="5">5</button>
            <button class="number" data-number="6">6</button>
            <button class="operator" data-action="subtract">−</button>
            
            <button class="number" data-number="1">1</button>
            <button class="number" data-number="2">2</button>
            <button class="number" data-number="3">3</button>
            <button class="operator" data-action="add">+</button>
            
            <button class="number" data-number=".">.</button>
            <button class="number" data-number="0">0</button>
            <button class="equals" data-action="calculate">=</button>
        </div>
    </div>

    <script>
        const currentOperandText = document.getElementById('current-operand');
        const previousOperandText = document.getElementById('previous-operand');
        const numberButtons = document.querySelectorAll('[data-number]');
        const operatorButtons = document.querySelectorAll('[data-action="add"], [data-action="subtract"], [data-action="multiply"], [data-action="divide"]');
        const clearButton = document.querySelector('[data-action="clear"]');
        const deleteButton = document.querySelector('[data-action="delete"]');
        const equalsButton = document.querySelector('[data-action="calculate"]');

        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        function updateDisplay() {
            currentOperandText.innerText = currentOperand;
            if (operation != null) {
                let opSymbol = operation;
                if (operation === 'add') opSymbol = '+';
                if (operation === 'subtract') opSymbol = '−';
                if (operation === 'multiply') opSymbol = '×';
                if (operation === 'divide') opSymbol = '÷';
                previousOperandText.innerText = `${previousOperand} ${opSymbol}`;
            } else {
                previousOperandText.innerText = '';
            }
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number;
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
        }

        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                calculate();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
        }

        function clear() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
        }

        function deleteNumber() {
            if (currentOperand === '0') return;
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '') currentOperand = '0';
        }

        function calculate() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            
            if (isNaN(prev) || isNaN(current)) return;
            
            switch (operation) {
                case 'add':
                    computation = prev + current;
                    break;
                case 'subtract':
                    computation = prev - current;
                    break;
                case 'multiply':
                    computation = prev * current;
                    break;
                case 'divide':
                    computation = prev / current;
                    break;
                default:
                    return;
            }
            
            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
        }

        numberButtons.forEach(button => {
            button.addEventListener('click', () => {
                appendNumber(button.dataset.number);
                updateDisplay();
            });
        });

        operatorButtons.forEach(button => {
            button.addEventListener('click', () => {
                chooseOperation(button.dataset.action);
                updateDisplay();
            });
        });

        clearButton.addEventListener('click', () => {
            clear();
            updateDisplay();
        });

        deleteButton.addEventListener('click', () => {
            deleteNumber();
            updateDisplay();
        });

        equalsButton.addEventListener('click', () => {
            calculate();
            updateDisplay();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9' || e.key === '.') {
                appendNumber(e.key);
                updateDisplay();
            }
            if (e.key === '+' || e.key === '-') {
                chooseOperation(e.key === '+' ? 'add' : 'subtract');
                updateDisplay();
            }
            if (e.key === '*') {
                chooseOperation('multiply');
                updateDisplay();
            }
            if (e.key === '/') {
                e.preventDefault();
                chooseOperation('divide');
                updateDisplay();
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculate();
                updateDisplay();
            }
            if (e.key === 'Backspace') {
                deleteNumber();
                updateDisplay();
            }
            if (e.key === 'Escape') {
                clear();
                updateDisplay();
            }
        });
    </script>
</body>
</html>
