<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        
        .active-song {
            background-color: #374151;
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-700">
        
        <div class="p-6 text-center">
            <div class="w-48 h-48 mx-auto mb-6 rounded-xl overflow-hidden shadow-lg relative group">
                <img id="cover-img" src="" alt="Cover Art" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
            </div>

            <h2 id="title" class="text-2xl font-bold text-white mb-1 truncate">Song Title</h2>
            <p id="artist" class="text-slate-400 text-sm mb-6 truncate">Artist Name</p>

            <div class="mb-6">
                <div class="flex justify-between text-xs text-slate-400 mb-2 font-medium">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full">
            </div>

            <div class="flex items-center justify-center gap-6 mb-6">
                <button id="prev-btn" class="text-slate-300 hover:text-white transition-colors p-2">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <button id="play-btn" class="bg-blue-600 text-white rounded-full p-4 hover:bg-blue-500 transition-all shadow-lg hover:shadow-blue-500/50 hover:scale-105">
                    <svg id="play-icon" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <button id="next-btn" class="text-slate-300 hover:text-white transition-colors p-2">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <div class="flex items-center gap-3 px-4">
                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                <input type="range" id="volume-bar" value="100" min="0" max="100" class="w-full">
            </div>
        </div>

        <div class="bg-slate-900/50 border-t border-slate-700">
            <div class="px-6 py-4 flex justify-between items-center text-sm font-semibold text-slate-300">
                <span>Playlist</span>
                <span class="text-blue-500 text-xs uppercase tracking-wider">Auto-Play On</span>
            </div>
            <ul id="playlist" class="max-h-48 overflow-y-auto pb-2 custom-scrollbar"></ul>
        </div>

    </div>

    <script>
        const songs = [
            {
                title: "Tum Hi Ho",
                artist: "Arijit Singh",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "https://placehold.co/400x400/1e40af/ffffff?text=Tum+Hi+Ho"
            },
            {
                title: "Pasoori",
                artist: "Ali Sethi & Shae Gill",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                cover: "https://placehold.co/400x400/9d174d/ffffff?text=Pasoori"
            },
            {
                title: "Chaiyya Chaiyya",
                artist: "A.R. Rahman",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                cover: "https://placehold.co/400x400/b45309/ffffff?text=Chaiyya"
            },
            {
                title: "Kahani Suno 2.0",
                artist: "Kaifi Khalil",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                cover: "https://placehold.co/400x400/065f46/ffffff?text=Kahani"
            },
            {
                title: "Kal Ho Naa Ho",
                artist: "Sonu Nigam",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
                cover: "https://placehold.co/400x400/5b21b6/ffffff?text=Kal+Ho+Naa+Ho"
            }
        ];

        let songIndex = 0;
        let isPlaying = false;
        const audio = new Audio();

        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const coverEl = document.getElementById('cover-img');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const volumeBar = document.getElementById('volume-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const playlistEl = document.getElementById('playlist');

        function loadSong(song) {
            titleEl.innerText = song.title;
            artistEl.innerText = song.artist;
            coverEl.src = song.cover;
            audio.src = song.src;
            renderPlaylist();
        }

        function playSong() {
            isPlaying = true;
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            audio.play();
        }

        function pauseSong() {
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            audio.pause();
        }

        function togglePlay() {
            if (isPlaying) pauseSong();
            else playSong();
        }

        function prevSong() {
            songIndex--;
            if (songIndex < 0) songIndex = songs.length - 1;
            loadSong(songs[songIndex]);
            if (isPlaying) playSong();
        }

        function nextSong() {
            songIndex++;
            if (songIndex > songs.length - 1) songIndex = 0;
            loadSong(songs[songIndex]);
            if (isPlaying) playSong();
        }

        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            if (isNaN(duration)) return;
            
            const progressPercent = (currentTime / duration) * 100;
            progressBar.value = progressPercent;
            
            currentTimeEl.innerText = formatTime(currentTime);
            durationEl.innerText = formatTime(duration);
        }

        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        }

        function setVolume(e) {
            audio.volume = e.target.value / 100;
        }

        function formatTime(time) {
            const minutes = Math.floor(time / 60);
            const seconds = Math.floor(time % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.className = `px-6 py-3 cursor-pointer hover:bg-slate-800 transition-colors flex items-center justify-between border-b border-slate-800/50 last:border-0 ${index === songIndex ? 'active-song' : ''}`;
                li.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-sm font-medium ${index === songIndex ? 'text-white' : 'text-slate-300'}">${song.title}</span>
                        <span class="text-xs text-slate-500">${song.artist}</span>
                    </div>
                    ${index === songIndex && isPlaying ? '<span class="flex gap-1 h-3 items-end"><span class="w-1 bg-blue-500 h-2 animate-pulse"></span><span class="w-1 bg-blue-500 h-3 animate-pulse" style="animation-delay: 150ms"></span><span class="w-1 bg-blue-500 h-1 animate-pulse" style="animation-delay: 300ms"></span></span>' : ''}
                `;
                li.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                });
                playlistEl.appendChild(li);
            });
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        audio.addEventListener('timeupdate', updateProgress);
        progressBar.addEventListener('click', setProgress);
        volumeBar.addEventListener('input', setVolume);
        
        audio.addEventListener('ended', nextSong);

        audio.addEventListener('loadeddata', () => {
            durationEl.innerText = formatTime(audio.duration);
        });

        loadSong(songs[songIndex]);
        audio.volume = 1;
    </script>
</body>
</html>
